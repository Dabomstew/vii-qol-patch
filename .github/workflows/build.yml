name: Build and synthetic tests
on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/build-release.ps1 -Tests
