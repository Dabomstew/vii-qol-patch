[Patches]
; Automatically skip skippable ADV events without confirmation; restart to apply.
AutoSkipEvents=0
; Remember an early event LT press; preserve keyboard order in its confirmation.
EventSkipBuffer=0
; Suppress automatic Teach Me Histy tutorials; keep manual help paths.
SuppressTutorials=0
; Hide optional dungeon previews in the world-map information window.
SuppressDungeonPreviews=0
; Skip battle animations, defeat waits, enemy movement, combo cut-ins and results.
BattleAutoSkip=0
; Apply JP high-level party/enemy damage and increased EXP/credit bonuses; restart.
JPBattleBalance=0
; Loading optimizations are on by default. Gameplay changes above remain opt-in.
MipCache=1
MotionCache=1
LooseFiles=1
; Remove the frame cap during detected loads, including blocked story-event queues.
; Keep Neptasm/FPSUnlock=0 for capped gameplay and camera sequences.
UnlockFPSDuringLoads=0
; Former neptasm graphics controls. Every control is disabled by default.
Neptasm=0
; Let the included LiveSplit script detect New Game; restart to apply.
NewGameDetector=1
; Load timing is always active; see docs/LOAD-TIMING.md for supported waits.

[LoadTiming]
; Log load boundaries for diagnostics.
Trace=0

[LooseFiles]
; Unpacker output folder. Relative paths start beside NeptuniaVII.exe.
Directory=vii-speedrun-patch\unpacked
; Full SHA-256 on every loose open; use for validation (slower).
Verify=0

[MipCache]
; Original loading avoids redundant cache work for textures needing one mip.
; Set 1 to restore single-mip caching for comparison.
SingleMipCache=0
BudgetMiB=256
MaxEntries=512
; Expensive full-DDS comparison on cache hits; use only for validation.
Verify=0
; Diagnostics are opt-in so normal play does no trace or source-capture I/O.
Trace=0
CaptureSources=0
DiskMode=2
; Relative paths are resolved beside NeptuniaVII.exe.
DiskDirectory=vii-speedrun-patch\cache

[MotionCache]
Mode=Replay
BudgetMiB=16

[EventSkipBuffer]
; Keep Up/Down/Enter presses in order in the skip confirmation.
; Requires Patches/EventSkipBuffer=1.
OrderedKeyboard=1
; Windows virtual-key codes; match any keyboard remapping in the game.
UpKey=38
DownKey=40
ConfirmKey=13

[Neptasm]
; All options below are opt-in and require Patches/Neptasm=1.
FPSUnlock=0
CameraUnlock=0
Resolution=0
; Multiplier used when Resolution=1 (1.0 keeps the selected output size).
ResolutionScale=1.0
; Use the client area of the configured window for the swap-chain size.
FitWindow=0
; Replace the game's ten selectable window-size entries.
WindowControl=0
WindowWidth=1920
WindowHeight=1080
; Expand the game's 16:9 view to the selected output size.
Ultrawide=0
